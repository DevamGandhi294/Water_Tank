# Local development stack (WSL + Docker).
#   docker compose up -d --build        postgres, mosquitto, backend, pgadmin
#   docker compose logs -f backend
# Production uses docker-compose.prod.yml (see DEPLOY.md).
name: waterlevel

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    # Mosquitto 2.0.18 + go-auth plugin: logins and ACLs are checked by the backend
    image: iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      - mosquitto_data:/var/lib/mosquitto
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_BACKEND_USERNAME: ${MQTT_BACKEND_USERNAME:-wt-backend}
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:-dev-backend-mqtt-password}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
      HASH_PEPPER: ${HASH_PEPPER:-dev-only-pepper-change-me}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      SMS_PROVIDER: ${SMS_PROVIDER:-none}
      DEV_ENDPOINTS: "true"
      OTA_DIR: /srv/ota
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      RATE_LIMIT_SCALE: ${RATE_LIMIT_SCALE:-1}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/scripts:/app/backend/scripts
      - ./backend/test:/app/backend/test
      - ./database/migrations:/app/database/migrations:ro
      - ota_files:/srv/ota
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mosquitto_data:
  pgadmin_data:
  ota_files:
