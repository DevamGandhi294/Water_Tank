# Production stack for the Contabo VPS (see DEPLOY.md).
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Nothing here binds public ports 80/443: the web server already on the VPS
# (it also serves magicoutline.ecobridgers.com) terminates HTTPS for
# watertank.ecobridgers.com and proxies to 127.0.0.1:${WEB_PORT}.
# Only MQTT over TLS (8883) is public.
name: watertank

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TRUST_PROXY: ${TRUST_PROXY:-2}
      JWT_SECRET: ${JWT_SECRET}
      HASH_PEPPER: ${HASH_PEPPER}
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_BACKEND_USERNAME: ${MQTT_BACKEND_USERNAME:-wt-backend}
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD}
      SMS_PROVIDER: ${SMS_PROVIDER:-none}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_OTP_TEMPLATE_ID: ${MSG91_OTP_TEMPLATE_ID:-}
      MSG91_INVITE_TEMPLATE_ID: ${MSG91_INVITE_TEMPLATE_ID:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      APP_LINK: ${APP_LINK:-}
      OTA_DIR: /srv/ota
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ota_files:/srv/ota
      - ./deploy/secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  mosquitto:
    image: iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18
    restart: unless-stopped
    ports:
      - "${MQTT_TLS_PORT:-8883}:8883"
      - "127.0.0.1:${MQTT_LOCAL_PORT:-1883}:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      - ./deploy/certs/mosquitto:/mosquitto/certs:ro
      - mosquitto_data:/var/lib/mosquitto
    depends_on:
      - backend
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: admin-panel/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      - backend
    networks: [internal]

volumes:
  pgdata:
  ota_files:
  mosquitto_data:

networks:
  internal:
