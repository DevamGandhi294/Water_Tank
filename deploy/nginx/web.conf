# Nginx inside the "web" container: serves the admin panel and forwards the API.
# TLS is done by the web server already running on the VPS (it proxies to this
# container on 127.0.0.1:${WEB_PORT}); see deploy/nginx/host-watertank.conf.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream backend {
  server backend:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 2m;

  # never expose the Mosquitto auth hook
  location /mqtt { return 404; }

  location /api/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  location /socket.io/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  # firmware downloads (signed links) and the legacy /ota/version.json for v1.3 boards
  location ~ ^/(fw|ota)/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
  }

  location = /health {
    proxy_pass http://backend;
    access_log off;
  }

  # admin panel (single page app)
  root /usr/share/nginx/html;
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "same-origin";
    try_files $uri /index.html;
  }
}
