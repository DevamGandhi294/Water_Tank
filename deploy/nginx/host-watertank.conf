# Server block for the web server that already runs on the VPS (host Nginx,
# the one that also serves magicoutline.ecobridgers.com).
# Copy to /etc/nginx/sites-available/watertank.ecobridgers.com, link it into
# sites-enabled, then run certbot --nginx (DEPLOY.md step 6).
# It only answers for watertank.ecobridgers.com, so magicoutline is untouched.

map $http_upgrade $wt_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name watertank.ecobridgers.com;

  client_max_body_size 2m;

  location / {
    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $wt_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }
}
