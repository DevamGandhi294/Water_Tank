# Production broker (mosquitto-go-auth image).
#   8883  TLS, public: the ESP boards connect here (mqtts://watertank.ecobridgers.com:8883)
#   1883  plain, only inside Docker (backend) and on 127.0.0.1 of the VPS (testing with mosquitto_sub)
# Logins and topic rights are checked by the backend over HTTP (see backend/src/routes/mqttAuth.js):
#   devices: username = client id = main board MAC (12 lowercase hex), any non-empty password
#   backend: MQTT_BACKEND_USERNAME / MQTT_BACKEND_PASSWORD
persistence true
persistence_location /var/lib/mosquitto/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
max_keepalive 300
max_queued_messages 200
message_size_limit 4096

per_listener_settings false
allow_anonymous false

listener 1883
protocol mqtt

listener 8883
protocol mqtt
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2

auth_plugin /mosquitto/go-auth.so
auth_opt_log_level warn
auth_opt_backends http
auth_opt_check_prefix false
auth_opt_disable_superuser true
auth_opt_http_host backend
auth_opt_http_port 3000
auth_opt_http_getuser_uri /mqtt/user
auth_opt_http_aclcheck_uri /mqtt/acl
auth_opt_http_params_mode json
auth_opt_http_response_mode status
auth_opt_http_method POST
auth_opt_http_timeout 5
auth_opt_cache true
auth_opt_cache_type go-cache
auth_opt_cache_reset true
auth_opt_auth_cache_seconds 2
auth_opt_acl_cache_seconds 60
auth_opt_auth_jitter_seconds 0
auth_opt_acl_jitter_seconds 0
