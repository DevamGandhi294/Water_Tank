name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, apk-build]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mobile-build-${GITHUB_RUN_NUMBER}"
          cp build/app/outputs/flutter-apk/app-release.apk water-tank.apk
          gh release create "$TAG" water-tank.apk --title "Water Tank app build ${GITHUB_RUN_NUMBER}" --notes "Test build, points at https://watertank.ecobridgers.com" --prerelease --target "$GITHUB_SHA"
