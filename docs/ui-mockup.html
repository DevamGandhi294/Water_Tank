<title>Water Tank App Screens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: screen index on the left, live device frame in the middle, the API calls that screen needs on the right. */
:root{
  --bg:#eef2f3; --panel:#ffffff; --ink:#14232a; --muted:#5b6f77; --line:#d5dfe2;
  --water:#1f7fb8; --water-2:#7cc4e8; --water-soft:#dceef8; --deep:#0e3a52;
  --ok:#1d8a52; --ok-soft:#dcf2e6; --warn:#b26a00; --warn-soft:#fbeed5; --bad:#c2372f; --bad-soft:#fbe1df;
  --frame:#1b262b; --screen:#f7fafb; --card:#ffffff;
  --get:#1d8a52; --post:#1f7fb8; --patch:#8a5a00; --put:#6b4fb3; --del:#c2372f;
  --display:"Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1518; --panel:#142024; --ink:#e3ecef; --muted:#93a8b0; --line:#26363c;
  --water:#4aa8dd; --water-2:#2a6f99; --water-soft:#16313f; --deep:#9fd3ef;
  --ok:#4cc286; --ok-soft:#143326; --warn:#e3a647; --warn-soft:#3a2b12; --bad:#ef6f66; --bad-soft:#3d1a18;
  --frame:#000; --screen:#101a1e; --card:#18252a;
  --get:#4cc286; --post:#4aa8dd; --patch:#e3a647; --put:#a68cf0; --del:#ef6f66; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1518; --panel:#142024; --ink:#e3ecef; --muted:#93a8b0; --line:#26363c;
  --water:#4aa8dd; --water-2:#2a6f99; --water-soft:#16313f; --deep:#9fd3ef;
  --ok:#4cc286; --ok-soft:#143326; --warn:#e3a647; --warn-soft:#3a2b12; --bad:#ef6f66; --bad-soft:#3d1a18;
  --frame:#000; --screen:#101a1e; --card:#18252a;
  --get:#4cc286; --post:#4aa8dd; --patch:#e3a647; --put:#a68cf0; --del:#ef6f66; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;max-width:1500px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px;margin-bottom:18px}
header.top h1{font-family:var(--display);font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
header.top p{margin:0;color:var(--muted);max-width:70ch}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 380px;gap:20px;align-items:start}
.layout.admin{grid-template-columns:230px minmax(0,1fr);}
.layout.admin .api{grid-column:2}
nav.index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:14px}
nav.index h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 4px;font-weight:600}
nav.index .grp{display:flex;flex-direction:column;gap:2px}
nav.index button{all:unset;cursor:pointer;padding:6px 10px;border-radius:7px;color:var(--ink);display:flex;gap:8px;align-items:baseline}
nav.index button .n{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:22px}
nav.index button:hover{background:var(--panel)}
nav.index button.on{background:var(--water);color:#fff}
nav.index button.on .n{color:#ffffffb0}
nav.index button:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.stage{display:flex;justify-content:center;min-width:0}
.api{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.api h3{font-family:var(--display);font-size:18px;margin:0 0 2px}
.api .why{color:var(--muted);margin:0 0 12px}
.api h4{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:16px 0 6px;font-weight:600}
.call{display:grid;grid-template-columns:52px minmax(0,1fr);gap:2px 8px;padding:8px;border-radius:8px;border:1px solid transparent;transition:background .3s,border-color .3s}
.call + .call{margin-top:2px}
.call .m{font-family:var(--mono);font-size:11px;font-weight:500;padding-top:1px}
.call .p{font-family:var(--mono);font-size:12.5px;word-break:break-word}
.call .d{grid-column:2;color:var(--muted);font-size:12.5px}
.call .r{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;white-space:nowrap}
.call .no{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-right:4px}
.m.GET{color:var(--get)} .m.POST{color:var(--post)} .m.PATCH{color:var(--patch)} .m.PUT{color:var(--put)} .m.DELETE{color:var(--del)} .m.WS,.m.MQTT{color:var(--deep)}
.call.fired{background:var(--water-soft);border-color:var(--water)}
.api .tip{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:14px;padding-top:10px}

/* ---------- phone ---------- */
.phone{width:372px;max-width:100%;background:var(--frame);border-radius:44px;padding:12px;box-shadow:0 20px 50px -20px #0e3a5266}
.scr{background:var(--screen);border-radius:33px;height:760px;overflow:hidden;display:flex;flex-direction:column;position:relative;color:var(--ink)}
.sbar{display:flex;justify-content:space-between;padding:12px 26px 4px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.body{flex:1;overflow-y:auto;padding:6px 18px 18px;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card)}
.tabs button{all:unset;cursor:pointer;flex:1;text-align:center;padding:10px 0 14px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--water);font-weight:600}
.tabs svg{width:20px;height:20px}
.ah{display:flex;align-items:center;gap:10px;min-height:40px}
.ah h2{font-family:var(--display);font-size:21px;margin:0;flex:1;letter-spacing:-.01em}

.ico{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);position:relative}
.ico .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.lbl{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500}
.inp{width:100%;font:inherit;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.inp:focus{outline:2px solid var(--water);border-color:transparent}
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:12px 16px;border-radius:12px;font-weight:600;background:var(--water);color:#fff;display:block}
.btn.ghost{background:transparent;color:var(--water);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px;display:inline-block}
.btn:focus-visible,.back:focus-visible,.ico:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--water-soft);color:var(--water)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 0 6px}
.brand b{font-family:var(--display);font-size:26px;letter-spacing:-.01em}
.otp{display:flex;gap:8px;justify-content:space-between}
.otp span{flex:1;aspect-ratio:1/1.15;max-width:100%;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;font-family:var(--mono);font-size:20px;background:var(--card)}
.otp span.f{border-color:var(--water)}
.tankcard{display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:center;cursor:pointer}
.tankcard:hover{border-color:var(--water)}
.minitank{width:62px;height:76px;border:2px solid var(--line);border-radius:10px;position:relative;overflow:hidden;background:var(--screen)}
.minitank .w{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--water-2),var(--water))}
.big{font-family:var(--display);font-size:46px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big small{font-size:20px;color:var(--muted);margin-left:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.stats b{display:block;font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted)}
.pumpbtn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line)}
.pumpbtn .sw{width:58px;height:32px;border-radius:99px;background:var(--line);position:relative;transition:background .25s}
.pumpbtn .sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .25s;box-shadow:0 1px 3px #0003}
.pumpbtn.on .sw{background:var(--ok)} .pumpbtn.on .sw::after{left:29px}
.pumpbtn.busy .sw{background:var(--water-2)}
.pumpbtn:focus-visible{outline:2px solid var(--water)}
.list{display:flex;flex-direction:column}
.list > div,.list > button{padding:11px 0;border-bottom:1px solid var(--line)}
.list > :last-child{border-bottom:0}
.list > button{all:unset;cursor:pointer;padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:7px;border-radius:8px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px #0001}
.toggle{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;border:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on{background:var(--water)} .toggle.on::after{left:21px}
input[type=range]{width:100%;accent-color:var(--water)}
.days{display:flex;gap:5px}
.days span{flex:1;text-align:center;font-size:11.5px;padding:6px 0;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.days span.on{background:var(--water-soft);color:var(--water);border-color:transparent;font-weight:600}
.scanner{aspect-ratio:1;max-width:100%;border-radius:20px;background:#0b1418;position:relative;overflow:hidden;display:grid;place-items:center}
.scanner .box{width:62%;aspect-ratio:1;border:3px solid #7cc4e8;border-radius:18px;position:relative}
.scanner .beam{position:absolute;left:8%;right:8%;height:2px;background:#7cc4e8;box-shadow:0 0 10px #7cc4e8;animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{top:12%}50%{top:86%}}
@media (prefers-reduced-motion: reduce){.scanner .beam{animation:none;top:50%}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;padding:18px;box-shadow:0 -10px 30px #0003;display:flex;flex-direction:column;gap:12px;z-index:3}
.scrim{position:absolute;inset:0;background:#0006;z-index:2}
.banner{border-radius:14px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.banner.info{background:var(--water-soft)} .banner.warn{background:var(--warn-soft)}
.toast{position:absolute;left:18px;right:18px;bottom:76px;background:var(--ink);color:var(--screen);padding:10px 14px;border-radius:12px;font-size:13px;z-index:5;transition:opacity .3s}
.chart{display:flex;align-items:flex-end;gap:6px;height:90px}
.chart div{flex:1;background:var(--water);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.chart div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.ev{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:start}
.ev i{width:8px;height:8px;border-radius:50%;margin-top:6px}

/* ---------- admin browser ---------- */
.browser{width:100%;max-width:1060px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 20px 50px -25px #0e3a5255}
.chrome{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
.chrome .dots{display:flex;gap:6px}.chrome .dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.chrome .url{flex:1;font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.adm{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:640px}
.adm aside{background:var(--deep);color:#fff;padding:16px 10px;display:flex;flex-direction:column;gap:2px}
:root[data-theme="dark"] .adm aside{background:#0a2533}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .adm aside{background:#0a2533}}
.adm aside b{font-family:var(--display);font-size:17px;padding:4px 10px 14px}
.adm aside b small{display:block;font-family:var(--body);font-weight:400;font-size:11px;opacity:.7}
.adm aside button{all:unset;cursor:pointer;padding:8px 10px;border-radius:7px;font-size:13.5px;color:#d9ecf6}
.adm aside button.on{background:#ffffff1f;color:#fff;font-weight:600}
.adm main{padding:20px 22px;display:flex;flex-direction:column;gap:16px;min-width:0;background:var(--screen)}
.adm h2{font-family:var(--display);font-size:22px;margin:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile span{font-size:12px;color:var(--muted)} .tile > b{display:block;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;margin-top:2px}
.tile em{font-style:normal;font-size:12px}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.mono,.mono{font-family:var(--mono);font-size:12px}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--water-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .inp{width:auto;flex:1;min-width:180px;padding:8px 11px}
.toolbar select{font:inherit;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
.qrbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.sticker{background:#fff;color:#111;border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;border:1px dashed #9ab}
.sticker #qr img,.sticker #qr canvas{width:116px;height:116px}
.secret{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

@media (max-width:1200px){ .layout{grid-template-columns:200px minmax(0,1fr)} .layout .api{grid-column:2} }
@media (max-width:820px){
  .layout,.layout.admin{grid-template-columns:minmax(0,1fr)} .layout .api,.layout.admin .api{grid-column:1}
  nav.index{position:static;flex-direction:row;overflow-x:auto;gap:16px;padding-bottom:6px}
  nav.index .grp{flex-direction:row;flex-wrap:nowrap;align-items:center;gap:4px} nav.index .grp h2{white-space:nowrap;margin:0 6px 0 0} nav.index .grp.note{display:none} nav.index{align-items:center}
  nav.index button{white-space:nowrap}
  .adm{grid-template-columns:minmax(0,1fr)} .adm aside{flex-direction:row;overflow-x:auto} .adm aside b{display:none}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} .two{grid-template-columns:minmax(0,1fr)}
  .scr{height:700px}
}
</style>

<div class="wrap">
  <header class="top">
    <h1>Water Tank app and admin panel</h1>
    <p>Click through the screens. Each one lists the API calls it needs on the right, and tapping a button in the mockup highlights the call it makes. Numbers match <span class="mono">docs/API.md</span>. All data is sample data.</p>
  </header>
  <div class="layout" id="layout">
    <nav class="index" id="index" aria-label="Screens"></nav>
    <div class="stage" id="stage"></div>
    <aside class="api" id="api" aria-live="polite"></aside>
  </div>
</div>

<script>
// ------------------------------------------------------------------ sample state
const S = {
  pumpOn:false, busy:false, online:true, status:'WORK',
  tankHeight:180, cutoff:35, cutoffDraft:35, version:4, applied:4, autoMode:true,
  distance:62.4, maxMin:60,
  histTab:'runs', timerSheet:false, shareSheet:false, removeSheet:false,
  admTab:'dashboard', reg:null, regErr:'', devQ:'', invite:true,
  timers:[
    {name:'Morning fill',start:'06:00',stop:'06:30',days:[1,1,1,1,1,1,1],below:null,on:true},
    {name:'Evening top-up',start:'18:00',stop:'18:20',days:[1,1,1,1,1,0,0],below:50,on:true},
  ],
};
const pct = () => Math.max(0, Math.min(100, Math.round((S.tankHeight - S.distance) / (S.tankHeight - S.cutoff) * 100)));

// ------------------------------------------------------------------ API catalogue (mirrors API.md)
const A = {
 '1.1':['POST','/auth/register','public','Create account, sends SMS OTP'],
 '1.2':['POST','/auth/otp/send','public','Send or resend OTP'],
 '1.3':['POST','/auth/otp/verify','public','Check the 6 digit code, returns tokens'],
 '1.4':['POST','/auth/login','public','Phone + password → access + refresh token'],
 '1.5':['POST','/auth/google','public','Google ID token → tokens (creates user if new)'],
 '1.6':['POST','/auth/refresh','public','Silent token refresh'],
 '1.7':['POST','/auth/logout','user','Log out this phone'],
 '1.8':['POST','/auth/logout-all','user','Log out every phone'],
 '1.9':['POST','/auth/password/reset','public','Set new password with reset token'],
 '2.1':['GET','/me','user','Profile + unread count'],
 '2.2':['PATCH','/me','user','Change name / email'],
 '2.3':['POST','/me/password','user','Change password'],
 '2.6':['POST','/me/push-tokens','user','Register FCM token on app start'],
 '2.8':['GET','/me/sessions','user','Logged-in phones'],
 '2.10':['DELETE','/me','user','Delete account'],
 '3.1':['GET','/devices','user','My tanks (owned + shared) with live state'],
 '3.2':['POST','/devices/claim/check','user','Check QR code before adding'],
 '3.3':['POST','/devices/claim','user','Add tank to my account (one owner only)'],
 '3.4':['GET','/devices/:id','view','Tank detail, boards, settings, open pump run'],
 '3.5':['PATCH','/devices/:id','owner','Rename, location, time zone'],
 '3.6':['DELETE','/devices/:id','owner','Remove tank from my account'],
 '3.7':['DELETE','/devices/:id/me','view','Leave a shared tank'],
 '4.1':['GET','/devices/:id/settings','view','Cutoff, height, auto mode, sync version'],

function tankSVG(){
  const p = pct(), H=230, top=16, inner=H-top-8;
  const cutY = top + inner * (S.cutoff / S.tankHeight);
  const fullH = inner * (1 - S.cutoff / S.tankHeight);
  const waterTop = top + inner - fullH * p / 100;
  return `<svg viewBox="0 0 220 ${H}" width="100%" style="max-width:240px;display:block;margin:0 auto" role="img" aria-label="Tank ${p}% full">
    <defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--water-2)"/><stop offset="1" stop-color="var(--water)"/></linearGradient></defs>
    <rect x="40" y="${top}" width="120" height="${inner}" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <clipPath id="tc"><rect x="41" y="${top+1}" width="118" height="${inner-2}" rx="13"/></clipPath>
    <rect clip-path="url(#tc)" x="40" y="${waterTop}" width="120" height="${top+inner-waterTop}" fill="url(#wg)" style="transition:y .6s,height .6s"/>
    <line x1="34" x2="166" y1="${cutY}" y2="${cutY}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="168" y="${cutY+4}" font-size="10" fill="var(--bad)" font-family="IBM Plex Mono, monospace">cutoff</text>
    <text x="168" y="${cutY+16}" font-size="10" fill="var(--bad)" font-family="IBM Plex Mono, monospace">${S.cutoff} cm</text>
    <rect x="88" y="${top-12}" width="24" height="10" rx="2" fill="var(--muted)"/>
    <line x1="100" x2="100" y1="${top}" y2="${waterTop}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="8" y="${(top+waterTop)/2+4}" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${S.distance} cm</text>
  </svg>`;
}

function renderIndex(){
  const g = (k,label) => `<div class="grp"><h2>${label}</h2>${Object.entries(SCREENS).filter(([,v])=>v.grp===k).map(([id,v])=>`<button data-nav="${id}" class="${cur===id?'on':''}"><span class="n">${v.n}</span>${v.t}</button>`).join('')}</div>`;
  $('#index').innerHTML = g('app','Customer app') + g('adm','Admin panel (super admin)') +
   `<div class="grp note"><h2>Always running</h2><div class="small muted" style="padding:0 10px">Socket.IO for live data, MQTT between backend and ESP. Full list in API.md sections 12 and 13.</div></div>`;
}
function renderApi(){
  const s = SCREENS[cur];
  const rest = s.api.filter(k=>!k.startsWith('ws.')&&!k.startsWith('mq.'));
  const live = s.api.filter(k=>k.startsWith('ws.')||k.startsWith('mq.'));
  const row = k => { const [m,p,r,d]=A[k]; return `<div class="call" data-k="${k}"><span class="m ${m}">${m}</span><span class="p">${/^\d/.test(k)?`<span class="no">${k}</span>`:''}${p}<span class="r">${r}</span></span><span class="d">${d}</span></div>`; };
  $('#api').innerHTML = `<h3>${s.n} · ${s.t}</h3><p class="why">${s.why}</p>
   <h4>REST calls</h4>${rest.map(row).join('')||'<div class="small muted">None</div>'}
   ${live.length?`<h4>Live (Socket.IO / MQTT)</h4>${live.map(row).join('')}`:''}
   <div class="tip">${s.grp==='app'?'Every app call sends <span class="mono">Authorization: Bearer &lt;accessToken&gt;</span> except public ones. A 401 triggers one silent <span class="mono">POST /auth/refresh</span>, then the call is retried.':'Admin calls need role super_admin. Every write is also saved in the audit log.'}</div>`;
}
function renderStage(){
  const s = SCREENS[cur];
  $('#layout').classList.toggle('admin', s.grp==='adm');
  if (s.grp==='app'){
    $('#stage').innerHTML = `<div class="phone"><div class="scr"><div class="sbar"><span>9:41</span><span>4G ▮▮▮ 82%</span></div>${s.r()}<div class="toast" id="toast" hidden></div></div></div>`;
  } else {
    const nav = Object.entries(SCREENS).filter(([,v])=>v.grp==='adm').map(([id,v])=>`<button data-adm="${id}" class="${cur===id?'on':''}">${v.t}</button>`).join('');
    $('#stage').innerHTML = `<div class="browser"><div class="chrome"><div class="dots"><i></i><i></i><i></i></div><div class="url">admin.watertank.ecobridgers.com/${cur}</div></div>
      <div class="adm"><aside><b>Water Tank<small>Super admin</small></b>${nav}</aside><main>${ADM[cur]()}</main></div></div>`;
    if (cur==='register' && S.reg && window.QRCode){ try{ new QRCode(document.getElementById('qr'),{text:'WT1:WT-2026-00129:'+S.reg.code,width:232,height:232,correctLevel:QRCode.CorrectLevel.M}); }catch(e){} }
  }
}
function render(){ renderIndex(); renderStage(); renderApi(); }
function go(id){ if(!SCREENS[id]) return; cur=id; S.timerSheet=S.shareSheet=S.removeSheet=false; render();
  const h = (SCREENS[id].grp==='app'?'app-':'admin-')+id; if (location.hash.slice(1)!==h) history.replaceState(null,'','#'+h); }
function fire(keys){ keys.split(',').forEach(k=>{ const el=document.querySelector(`.call[data-k="${k}"]`); if(el){ el.classList.remove('fired'); void el.offsetWidth; el.classList.add('fired'); setTimeout(()=>el.classList.remove('fired'),1600);} }); }
function toast(t){ const el=$('#toast'); if(!el) return; el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>{el.hidden=true},2200); }

document.addEventListener('click', e=>{
  const nav = e.target.closest('[data-nav]'); if (nav){ go(nav.dataset.nav); return; }
  const adm = e.target.closest('[data-adm]');
  const act = e.target.closest('[data-act]');
  const g = e.target.closest('[data-go]');
  const apiEl = e.target.closest('[data-api]');
  const apiKeys = apiEl && apiEl.dataset.api;
  if (act){
    const a = act.dataset.act;
    if (a==='pump' && !S.busy){ S.busy=true; renderStage(); fire('5.1'); setTimeout(()=>fire('mq.cmd'),400);
      setTimeout(()=>{ S.busy=false; S.pumpOn=!S.pumpOn; if(S.pumpOn) S.distance=Math.max(S.cutoff+2, S.distance-4); renderStage(); fire('ws.cmd'); setTimeout(()=>fire('ws.state'),300); toast(S.pumpOn?'Pump is ON. Device confirmed.':'Pump is OFF. Device confirmed.'); },1300); return; }
    if (a==='saveCut'){ S.cutoff=S.cutoffDraft; S.version++; renderStage(); fire('4.2'); setTimeout(()=>fire('mq.set'),400);
      setTimeout(()=>{ S.applied=S.version; if(cur==='tank-settings') renderStage(); fire('ws.sync'); toast('Saved on device ✓ The pump now stops at '+S.cutoff+' cm.'); },1800); return; }
    if (a==='auto'){ S.autoMode=!S.autoMode; S.version++; renderStage(); fire('4.2'); setTimeout(()=>{S.applied=S.version; if(cur==='tank-settings') renderStage(); fire('ws.sync');},1500); return; }
    if (a==='remove'){ S.removeSheet=!S.removeSheet; if(!g){ renderStage(); if(apiKeys) fire(apiKeys); return; } }
    if (a==='timer'){ S.timerSheet=!S.timerSheet; renderStage(); return; }
    if (a==='addTimer'){ S.timers.push({name:'Night',start:'21:00',stop:'21:15',days:[1,1,1,1,1,1,1],below:50,on:true}); S.timerSheet=false; renderStage(); fire('6.2'); toast('Timer saved'); return; }
    if (a.startsWith('tt')){ const t=S.timers[+a.slice(2)]; t.on=!t.on; renderStage(); fire('6.3'); return; }
    if (a==='share'){ const sending = act.classList.contains('btn'); S.shareSheet=!S.shareSheet; renderStage(); if(sending){fire('7.2'); toast('Invite sent to +91 91234 56789');} return; }
    if (a==='hr'||a==='he'){ S.histTab=a==='hr'?'runs':'ev'; renderStage(); fire(apiKeys); return; }
    if (a==='tg'){ act.classList.toggle('on'); fire('9.4'); return; }
    if (a==='inviteYes'||a==='inviteNo'){ S.invite=false; renderStage(); fire(apiKeys); toast(a==='inviteYes'?'Farm Tank added to your list':'Invite declined'); return; }
    if (a==='reg'){ const m=$('#rm').value.trim(), s=$('#rs').value.trim(), ok=/^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$/;
      if(!ok.test(m)||!ok.test(s)){ S.regErr='MAC must look like A4:CF:12:9B:42:10'; S.reg=null; }
      else if(m.toUpperCase()===s.toUpperCase()){ S.regErr='Main and sender MAC must be different'; S.reg=null; }
      else { S.regErr=''; const r=n=>Array.from({length:n},()=> 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*31)]).join(''); S.reg={code:r(4)+'-'+r(4),secret:r(32).toLowerCase()}; }
      renderStage(); fire('10.4'); return; }
    if (a==='push'){ fire('10.26'); setTimeout(()=>fire('mq.ota'),400); setTimeout(()=>fire('ws.ota'),900); return; }
  }
  if (adm){ go(adm.dataset.adm); if(apiKeys) setTimeout(()=>fire(apiKeys),50); return; }
  if (g){ const k=apiKeys; go(g.dataset.go); if(k) setTimeout(()=>fire(k),50); return; }
  if (apiKeys){ fire(apiKeys); }
});
document.addEventListener('change', e=>{ if (e.target.id==='cut'){ renderStage(); const n=$('#cut'); if(n) n.focus(); } });
document.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const c=e.target.closest('.tankcard[data-go]'); if(c) go(c.dataset.go); }});
document.addEventListener('input', e=>{
  if (e.target.id==='cut'){ S.cutoffDraft=+e.target.value; const v=$('#cutv'); if(v) v.textContent=S.cutoffDraft+' cm'; }
  if (e.target.id==='dq'){ S.devQ=e.target.value; renderStage(); const n=$('#dq'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length);} fire('10.3'); }
});
function fromHash(){ const h=location.hash.slice(1).replace(/^(app|admin)-/,''); if(SCREENS[h]) { cur=h; } render(); }
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
