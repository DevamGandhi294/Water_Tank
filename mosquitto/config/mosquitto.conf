# Development broker (mosquitto-go-auth image). Same auth as production:
# Mosquitto asks the backend (HTTP) who may log in and which topics they may use.
#   devices: username = client id = main board MAC (12 lowercase hex), no password
#   backend: MQTT_BACKEND_USERNAME / MQTT_BACKEND_PASSWORD (superuser)
# Production adds a TLS listener on 8883, see deploy/mosquitto/mosquitto.conf.
persistence true
persistence_location /var/lib/mosquitto/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

per_listener_settings false
allow_anonymous false

listener 1883
protocol mqtt

auth_plugin /mosquitto/go-auth.so
auth_opt_log_level info
auth_opt_backends http
auth_opt_check_prefix false
auth_opt_http_host backend
auth_opt_http_port 3000
auth_opt_http_getuser_uri /mqtt/user
auth_opt_disable_superuser true
auth_opt_http_aclcheck_uri /mqtt/acl
auth_opt_http_params_mode json
auth_opt_http_response_mode status
auth_opt_http_method POST
auth_opt_http_timeout 5
auth_opt_cache true
auth_opt_cache_type go-cache
auth_opt_cache_reset true
auth_opt_auth_cache_seconds 2
auth_opt_acl_cache_seconds 60
auth_opt_auth_jitter_seconds 0
auth_opt_acl_jitter_seconds 0
